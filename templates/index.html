<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gender Classifier</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <h1>Gender classifier</h1>
    <p class="subtitle">Upload a face image to get a prediction</p>

    <form id="upload-form">
      <label for="file-input" class="drop-zone" id="drop-zone">
        <span id="drop-text">Click to choose an image, or drag one here</span>
        <img id="preview" src="" alt="" hidden>
      </label>
      <input type="file" id="file-input" name="image" accept="image/*" hidden>

      <button type="submit" id="submit-btn" disabled>Predict</button>
    </form>

    <div id="result" class="result" hidden>
      <div class="result-label" id="result-label"></div>
      <div class="confidence-bar">
        <div class="confidence-fill" id="confidence-fill"></div>
      </div>
      <div class="confidence-text" id="confidence-text"></div>
    </div>

    <div id="error" class="error" hidden></div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const dropText = document.getElementById('drop-text');
    const preview = document.getElementById('preview');
    const submitBtn = document.getElementById('submit-btn');
    const form = document.getElementById('upload-form');
    const result = document.getElementById('result');
    const resultLabel = document.getElementById('result-label');
    const confidenceFill = document.getElementById('confidence-fill');
    const confidenceText = document.getElementById('confidence-text');
    const errorBox = document.getElementById('error');

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        handleFile(fileInput.files[0]);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      dropText.hidden = true;
      submitBtn.disabled = false;
      result.hidden = true;
      errorBox.hidden = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Predicting...';
      errorBox.hidden = true;

      const formData = new FormData();
      formData.append('image', fileInput.files[0]);

      try {
        const res = await fetch('/predict', { method: 'POST', body: formData });
        if (!res.ok) throw new Error('Prediction failed');
        const data = await res.json();

        resultLabel.textContent = data.prediction;
        confidenceFill.style.width = data.confidence + '%';
        confidenceText.textContent = `${data.confidence}% confidence`;
        result.hidden = false;
      } catch (err) {
        errorBox.textContent = 'Something went wrong. Please try again.';
        errorBox.hidden = false;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Predict';
      }
    });
  </script>
</body>
</html>
